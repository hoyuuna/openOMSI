# Builds openOMSI for Windows and Linux (x64, ARM64), macOS (Apple silicon, Intel) and Android
# (plus the dedicated server for Linux and Windows) when a maintainer runs it from main
# (Actions -> Release -> Run workflow) and publishes them as the beta (pre-release)
# v<MAJOR.MINOR.PATCH>; promote.yml makes a tested beta the stable release. A push to main
# builds every platform and publishes nothing. See docs/VERSIONING.md.
# Pull requests build Windows x64, macOS (Apple silicon), Linux x64 and Android, without publishing;
# the label ci:all-platforms builds all seven (from the next push or run).
name: Release

on:
  pull_request:
    paths-ignore: ["docs/**", "site/**", "*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "*.md"]
  workflow_dispatch:
    # (a beta of one platform alone, to test a fix only that platform needs; a published
    # release keeps its files, so the others never join it, and it cannot be promoted)
    inputs:
      only:
        description: Platform to build and release alone
        type: choice
        default: all
        options: [all, windows, macos, linux, android]

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The builds (and the actions they use) only read the repository; `release` alone writes,
# with its own permission below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # a pull request's test build says which pull request it is: 0.1.1313-pr1192 (the
      # launcher shows it, and the updater leaves such a build alone)
      - id: v
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "version=$(sh scripts/version.sh)${PR:+-pr$PR}" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.v.outputs.version }}
        run: echo "### openOMSI $VERSION" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: version
    # build android always
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
      # the signing key (base64 of a keystore, alias openomsi, password android); without
      # it every build is signed with a new key and does not install over the last one
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      # a pull request's APK is an app of its own beside the release (scripts/build-android.sh)
      OPENOMSI_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build
        run: scripts/build-android.sh
      - name: Package
        run: |
          mkdir -p out
          cp "dist/android/openOMSI-$OPENOMSI_VERSION.apk" "out/openOMSI-$OPENOMSI_VERSION-android-arm64.apk"
          # (and under a name of its own: releases/latest/download/openOMSI-android.apk is
          # always the newest stable APK - for a phone whose installed build cannot update itself)
          cp "dist/android/openOMSI-$OPENOMSI_VERSION.apk" "out/openOMSI-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          # (a release keeps its files; a pull request's test builds are fetched within days)
          retention-days: 14
          name: android
          path: out/*.apk

  release:
    # (the platforms not built again are skipped, not failed)
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish v${{ needs.version.outputs.version }} (beta)
        run: |
          ls -l out
          if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "v$VERSION" --yes
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already published and stays as it is: a fix is released as a new version"
            exit 1
          fi
          prev=$(git tag -l "v${VERSION%.*}.*" --sort=-v:refname | grep -vx "v$VERSION" | head -1)
          if [ -n "$prev" ] && ! git merge-base --is-ancestor "$prev" "$GITHUB_SHA"; then
            echo "::error::$GITHUB_SHA is older than $prev: only a newer commit of main is released"
            exit 1
          fi
          if ! git tag "v$VERSION" "$GITHUB_SHA" 2>/dev/null && [ "$(git rev-parse "v$VERSION^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::the tag v$VERSION already names another commit"
            exit 1
          fi
          git push origin "v$VERSION"
          sh scripts/release-notes.sh "$VERSION" > notes.md
          cd out
          files=$(ls *.zip *.apk *.dmg *.exe 2>/dev/null || true)
          sha256sum $files > SHA256SUMS
          gh release create "v$VERSION" $files SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "openOMSI $VERSION" \
            --notes-file ../notes.md
